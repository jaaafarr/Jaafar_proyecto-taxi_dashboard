<!DOCTYPE html>
<html>
<head>
    <title>EDA NYC Taxi Dashboard</title>
    <link rel="stylesheet"
     href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        .chart-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            height: 450px; /* Altura fija para la mayoría de los gráficos */
        }
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 20px;
        }
    </style>
</head>
<body class="p-4 bg-light">
    <div class="container">
        <h1 class="text-center text-primary mb-5">Exploratory Data Analysis - NYC Taxi Dashboard 🚕</h1>

        <h2 class="mt-5 mb-4 text-secondary">Visualizaciones Clave (Gráficos EDA)</h2>
        <hr>

        <div class="charts-grid">
            <div class="chart-container">
                {{ chart_distribution|safe }}
            </div>

            <div class="chart-container">
                {{ chart_demand|safe }}
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-container" style="grid-column: 1 / -1;">
                {{ chart_scatter|safe }}
            </div>
        </div>


        <h2 class="mt-5 mb-4 text-secondary">Datos Crudos y Estadísticas</h2>
        <hr>

        <h3>Primeras 5 Filas</h3>
        <div class="table-responsive">
            {{ head|safe }}
        </div>

        <h3 class="mt-4">Estadísticas Descriptivas</h3>
        <div class="table-responsive">
            {{ summary|safe }}
        </div>

    </div>
</body>
</html>
